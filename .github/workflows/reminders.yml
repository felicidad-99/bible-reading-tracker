# Fires the prod reminder sweep every 10 minutes.
# Auth: Bearer CRON_SECRET (GitHub Actions secret mirrors the Vercel env var).
# Canonical production domain: https://bible-track.vercel.app
name: Reminder push cron

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  fire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger reminder push sweep
        run: >-
          curl -fsSL -X GET
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
          "https://bible-track.vercel.app/api/cron/reminders"
